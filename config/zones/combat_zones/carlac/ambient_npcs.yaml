            - speed: 2.5
              animation_id: 2          # loc_walk
              wander:
                radius: 8
                min_offset: 3
                origin: {x: 64.223526, y: 0.8557193, z: 55.02534, w: 1}
              min_duration_millis: 0   # step ends the moment he arrives
            - animation_id: 1          # loc_stand
